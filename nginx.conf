log_format panlai_upstream '$remote_addr [$time_local] "$request" status=$status '
                           'upstream=$upstream_addr upstream_status=$upstream_status '
                           'request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML 文件不缓存，确保用户每次都能获取最新版本
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 版本信息文件不缓存，用于版本检测
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Keep long-running Panlai generation requests on the same origin. This avoids
    # browsers hiding intermittent upstream gateway failures behind a generic CORS error.
    location ^~ /panlai-api/ {
        access_log /var/log/nginx/access.log panlai_upstream;
        proxy_pass https://api.panlai.me/;
        proxy_http_version 1.1;
        proxy_set_header Host api.panlai.me;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name api.panlai.me;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100m;
    }

    # JS、CSS 等静态资源，使用短期缓存（1小时）+ 协商缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: Publish Alien AI Studio Agent

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: canvas-agent/package-lock.json

      - name: Install dependencies
        working-directory: canvas-agent
        run: npm ci

      - name: Test and build
        working-directory: canvas-agent
        run: |
          npm test
          npm run build

      - name: Verify release tag
        if: github.event_name == 'push'
        working-directory: canvas-agent
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "agent-v${package_version}"

      - name: Publish missing version
        working-directory: canvas-agent
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published"
          else
            npm publish --access public --provenance
          fi
